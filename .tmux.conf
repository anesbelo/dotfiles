# Enable Vi mode
setw -g mode-keys vi

# Set the default shell explicitly
set -g default-shell "$SHELL"

# Allow tmux to send 256-color to its "parent terminal"
set -ag terminal-overrides ",*-256color*:Tc"

# Load catppuccin theme and make the status line pretty
set -g @catppuccin_window_status_style "rounded"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery_enabled.tmux
set -agF status-right "#{?#{#{==:#{E:@battery_exists},true}},#{E:@catppuccin_status_battery},}"

# Load plugins
run ~/.config/tmux/plugins/tmux-plugins/tmux-sensible/sensible.tmux
run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux
run ~/.config/tmux/plugins/tmux-plugins/tmux-copycat/copycat.tmux
run ~/.config/tmux/plugins/tmux-plugins/tmux-yank/yank.tmux
run ~/.config/tmux/plugins/tmux-plugins/tmux-pain-control/pain_control.tmux
